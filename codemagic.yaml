workflows:
  ios-debug-ipa:
    name: iOS Debug IPA (Unsigned)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          # 1. Verify firebase_options.dart exists in the repository
          if [ ! -f "lib/firebase_options.dart" ]; then
            echo "❌ ERROR: lib/firebase_options.dart is missing!"
            echo "Please remove it from your .gitignore and commit it to your repository."
            exit 1
          fi
          
          # Recreate the .env file to fix the "No file or variants found for asset: .env" error
          if [ -n "$ENV_BASE64" ]; then
            echo "$ENV_BASE64" | base64 --decode > .env
            echo "✅ .env file successfully created from environment variable."
          else
            echo "⚠️ WARNING: ENV_BASE64 is not set! Creating an empty .env file so the build doesn't crash."
            touch .env
          fi
          
          flutter pub get
          
          # 2. Fix Xcode project so 'flutter build' detects iOS 15.0 for Podfile generation
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g' ios/Runner.xcodeproj/project.pbxproj || true

          # 3. Generate the Podfile in case it was not committed from Windows. 
          flutter build ios --config-only --no-codesign || true

          cd ios
          # 4. Very forcefully rewrite Podfile platform definition for iOS 15.0
          echo "platform :ios, '15.0'" > podfile_temp
          grep -v "platform :ios" Podfile >> podfile_temp
          mv podfile_temp Podfile

          # 5. Delete any existing lockfile to ensure fresh CocoaPods resolution
          rm -f Podfile.lock

          pod install --repo-update
      - name: Build iOS (No Codesign)
        script: |
          # 6. Inject a dummy Development Team to bypass Flutter's strict team validation
          echo "DEVELOPMENT_TEAM = V8424N534K" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = \"\"" >> ios/Flutter/Release.xcconfig

          # 7. Build the Unsigned App
          flutter build ios --release --no-codesign
      - name: Manual IPA Packaging
        script: |
          # 8. Package the .app into a standard .ipa payload
          mkdir -p build/ios/iphoneos/Payload
          cd build/ios/iphoneos
          mv Runner.app Payload/
          zip -r -y found_it.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa