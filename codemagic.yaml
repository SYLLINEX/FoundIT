workflows:
  ios-debug-ipa:
    name: iOS Debug IPA (Unsigned)
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          
          # Fix Xcode project so 'flutter build' detects iOS 14.0 for Podfile generation
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' ios/Runner.xcodeproj/project.pbxproj || true

          # Generate the Podfile in case it was not committed from Windows
          flutter build ios --config-only || true

          cd ios
          # Very forcefully rewrite Podfile platform definition for iOS 14.0
          echo "platform :ios, '14.0'" > podfile_temp
          grep -v "platform :ios" Podfile >> podfile_temp
          mv podfile_temp Podfile

          # Delete any existing lockfile to ensure fresh resolution
          rm -f Podfile.lock

          pod install --repo-update
      - name: Build iOS (No Codesign)
        script: |
          # We use --release because it's easier to sideload for testing
          flutter build ios --release --no-codesign
      - name: Manual IPA Packaging
        script: |
          # Xcode creates a .app folder; we must wrap it in 'Payload' to make it an .ipa
          mkdir -p build/ios/iphoneos/Payload
          cd build/ios/iphoneos
          mv Runner.app Payload/
          # We must use -y to preserve symlinks inside iOS frameworks, otherwise the app is corrupted
          zip -r -y found_it.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa
