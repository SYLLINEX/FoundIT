workflows:
  ios-debug-ipa:
    name: iOS Debug IPA (Unsigned)
    instance_type: mac_mini_m2
    environment:
      # groups:
      #   - credentials # Uncomment if you need environment variables
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
          # Generate the Podfile in case it was not committed from Windows
          flutter build ios --config-only || true
          
          # Force minimum iOS deployment target to 14.0 to satisfy Firebase
          cd ios
          sed -i '' "s/^# platform :ios,.*/platform :ios, '14.0'/" Podfile || true
          sed -i '' "s/^platform :ios,.*/platform :ios, '14.0'/" Podfile || true
          
          # Ensure Xcode project also targets 14.0
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 14.0/g' Runner.xcodeproj/project.pbxproj || true
          
          # More aggressive Ruby script override to ensure platform 14.0 is set properly
          ruby -pi -e "gsub(/^[#\s]*platform\s+:ios.*/, %q(platform :ios, '14.0'))" Podfile
          rm -f Podfile.lock

          pod install --repo-update
      - name: Build iOS (No Codesign)
        script: |
          # We use --release because it's easier to sideload for testing
          flutter build ios --release --no-codesign
      - name: Manual IPA Packaging
        script: |
          # Xcode creates a .app folder; we must wrap it in 'Payload' to make it an .ipa
          mkdir -p build/ios/iphoneos/Payload
          cd build/ios/iphoneos
          mv Runner.app Payload/
          # We must use -y to preserve symlinks inside iOS frameworks, otherwise the app is corrupted
          zip -r -y found_it.ipa Payload
    artifacts:
      - build/ios/iphoneos/*.ipa

  